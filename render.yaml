# render.yaml
# Конфігурація для розгортання в 1 клік на Render.com
services:
  - type: web
    name: fragrance-wheel-matcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
